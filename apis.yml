name: Nickelytics
description: >-
  Nickelytics is a data-driven out-of-home (OOH) and digital-out-of-home (DOOH)
  advertising platform that turns moving assets into measurable media. It wraps
  gig-economy and rideshare vehicles, autonomous sidewalk delivery robots, and
  e-scooters with brand campaigns, then layers geo-targeting, programmatic DOOH
  buying, route verification, proof-of-play, and performance reporting into a
  single campaign dashboard. Nickelytics was acquired by Kiwibot for roughly $25M
  in September 2024 and now operates as the "r-ads" advertising product of
  Robot.com. It has no public developer API, OpenAPI, or documentation surface;
  campaign activation runs through an advertiser dashboard rather than an API.
