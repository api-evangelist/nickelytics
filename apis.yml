apis:
- name: Nickelytics R-Ads Platform Authentication API
  description: The authentication, session, organization and admin API behind the Nickelytics / R-Ads
    Ad Manager. It is a Better Auth instance whose auto-generated OpenAPI 3.1.1 document is served publicly
    at /api/auth/open-api/generate-schema on both api.nickelytics.com and api-ads.robot.com (the same
    AWS load balancer), covering email and social sign-in, sessions, account linking, JWT/JWKS issuance,
    organizations, teams, invitations, SSO providers, admin user management and audit events. It is a
    framework-generated auth surface, not a documented advertising product API — the campaign and reporting
    surface at /v1 answers 401 "Authorization header required" and publishes no specification.
  humanURL: https://www.robot.com/r-advertising
  baseURL: https://api-ads.robot.com/api/auth
