name: Nickelytics
description: Nickelytics is a data-driven out-of-home (OOH) and digital-out-of-home (DOOH) advertising
  platform that turns moving assets into measurable media. It wraps gig-economy and rideshare vehicles,
  autonomous sidewalk delivery robots, and e-scooters with brand campaigns, then layers geo-targeting,
  programmatic DOOH buying, route verification, proof-of-play, and performance reporting into a single
  campaign dashboard. Nickelytics was acquired by Kiwibot for roughly $25M in September 2024; Kiwibot
  rebranded to Robot.com in 2025 and Nickelytics now ships as the "R-Ads" advertising product, a self-serve
  suite covering robot media (RDOOH), vehicle wraps (MOOH) and digital screens (DOOH), bought through
  the R-Ads Ad Manager at admanager.robot.com. Nickelytics publishes no developer portal, API reference
  or SDKs. The only machine-readable contract it serves is the platform authentication API — a Better
  Auth instance whose OpenAPI 3.1.1 document is public at api.nickelytics.com and api-ads.robot.com —
  while the campaign/reporting surface behind /v1 is authenticated and undocumented.
